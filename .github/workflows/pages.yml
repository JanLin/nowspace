name: Website

# Publishes site/ to nowspace.org via GitHub Pages. The app's own deploy is a
# separate path (deploy/update-nowspace.sh on the mini); neither should fire
# for the other's commits.
#
# MANUAL ONLY, deliberately. GitHub Pages isn't enabled on this repository
# (the API returns 404 for /pages), so configure-pages fails at the last step
# and every push touching site/ sent a failure mail for a site nobody has
# asked to publish yet. Run it from the Actions tab when the site is ready.
#
# To publish: enable Pages (Settings → Pages → Source: GitHub Actions — needs
# a paid plan while the repo is private), then put the push trigger back:
#   push:
#     branches: [main]
#     paths: ["site/**", "docs/philosophy.md", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run is always newer than a running one; let it win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # philosophy.html is generated, never committed — it cannot drift from
      # docs/philosophy.md because it does not exist until this runs.
      - run: python3 site/build.py
      # templates, the build script and the developer README are sources, not
      # pages — publishing them would serve raw {{TITLE}} placeholders and
      # internal notes at nowspace.org
      - run: rm -rf site/templates site/build.py site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
