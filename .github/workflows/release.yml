name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build backend binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --name "nowspace-server" \
            --paths "." \
            --collect-submodules backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            backend/run_server.py

      - name: Build backend binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "nowspace-server" `
            --paths "." `
            --collect-submodules backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            backend/run_server.py

      - name: Copy sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp dist/nowspace-server frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries
          Copy-Item dist/nowspace-server.exe frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}.exe

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}*

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Nowspace ${{ github.ref_name }}'
          releaseBody: |
            Release notes are added automatically from docs/releases/<version>.md
            (see the publish-notes job); this placeholder is replaced.
          releaseDraft: true
          prerelease: false

  # After all platforms upload their versioned installers, add stable-named
  # copies (the README's /releases/latest/download links depend on these
  # names never changing) and fill the release body from
  # docs/releases/<version>.md. Deriving the copies from the release's own
  # assets is layout-proof — bundle paths on the runners are not (that
  # exact mistake broke the first 0.4.0 run).
  finalize-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload stable-named assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          dl() { gh release download "$TAG" --pattern "$1" --output "$stage/$2"; }
          dl "*_aarch64.dmg"     Nowspace-macos-arm64.dmg
          dl "*_x64-setup.exe"   Nowspace-windows-x64-setup.exe
          dl "*_amd64.AppImage"  Nowspace-linux-x86_64.AppImage
          dl "*_amd64.deb"       Nowspace-linux-amd64.deb
          gh release upload "$TAG" "$stage"/* --clobber
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "No $notes — leaving a placeholder body" >&2
            printf 'See the commit history for changes in %s.\n' "$TAG" > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          # Only one release is published at a time, so the visible one has to
          # introduce the app as well as list what changed — someone landing
          # on the Releases page may never see the README.
          # Strip the intro's own HTML comment: it explains the file to
          # whoever edits it, and has no business in a published body — it
          # doesn't render, but it is there in the raw text.
          sed '/^<!--/,/-->/d' docs/release-intro.md > /tmp/body.md
          cat "$notes" >> /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # tauri-action creates a DRAFT. Nothing published it, which is how
          # v0.4.1 sat unreleased while /releases/latest — and every download
          # link in the README — went on serving v0.4.0.
          gh release edit "$TAG" --draft=false --latest

      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Guard first: never delete anything until THIS release is published
          # and carries the four stable-named installers the README links to.
          # A prune that ran on a half-finished release would leave the
          # download links pointing at nothing.
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = "false" ] || { echo "$TAG is still a draft — not pruning"; exit 1; }
          for want in Nowspace-macos-arm64.dmg Nowspace-windows-x64-setup.exe \
                      Nowspace-linux-x86_64.AppImage Nowspace-linux-amd64.deb; do
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$want" \
              || { echo "$TAG is missing $want — not pruning"; exit 1; }
          done

          # Older releases go; their TAGS stay (no --cleanup-tag). The tag is
          # invisible on the Releases page once the release object is gone,
          # and it is the only way to tell what a given deployment was running.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -vFx "$TAG" \
            | while read -r old; do
                echo "removing superseded release $old (tag kept)"
                gh release delete "$old" --yes
              done
