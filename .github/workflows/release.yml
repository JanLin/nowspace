name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build backend binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --noconfirm \
            --onefile \
            --name "nowspace-server" \
            --paths "." \
            --collect-submodules backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            backend/run_server.py

      - name: Build backend binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "nowspace-server" `
            --paths "." `
            --collect-submodules backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            backend/run_server.py

      - name: Copy sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp dist/nowspace-server frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries
          Copy-Item dist/nowspace-server.exe frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}.exe

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}*

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Nowspace ${{ github.ref_name }}'
          releaseBody: |
            Release notes are added automatically from docs/releases/<version>.md
            (see the publish-notes job); this placeholder is replaced.
          releaseDraft: true
          prerelease: false

      # The README links to /releases/latest/download/<stable name> — those
      # names must not change between versions, so upload a stable-named
      # copy of each installer alongside the versioned one.
      - name: Upload stable-named assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="frontend/src-tauri/target/${{ matrix.target }}/release/bundle"
          stage="$(mktemp -d)"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              cp "$bundle"/dmg/*.dmg "$stage/Nowspace-macos-arm64.dmg" ;;
            x86_64-pc-windows-msvc)
              cp "$bundle"/nsis/*-setup.exe "$stage/Nowspace-windows-x64-setup.exe" ;;
            x86_64-unknown-linux-gnu)
              cp "$bundle"/appimage/*.AppImage "$stage/Nowspace-linux-x86_64.AppImage"
              cp "$bundle"/deb/*.deb "$stage/Nowspace-linux-amd64.deb" ;;
          esac
          gh release upload "$TAG" "$stage"/* --clobber

  # Fill the (draft) release body from docs/releases/<version>.md so every
  # release ships real notes; falls back to a pointer if the file is missing.
  publish-notes:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "No $notes — leaving a placeholder body" >&2
            printf 'See the commit history for changes in %s.\n' "$TAG" > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          gh release edit "$TAG" --notes-file "$notes"
          args: --target ${{ matrix.target }}
