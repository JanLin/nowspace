name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build backend binary (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET_ARCH: ${{ matrix.arch || '' }}
        run: |
          ARCH_FLAG=""
          if [ "$TARGET_ARCH" = "x86_64" ]; then
            ARCH_FLAG="--target-architecture x86_64"
          fi
          pyinstaller \
            --noconfirm \
            --onefile \
            --name "nowspace-server" \
            --paths "." \
            --collect-submodules backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            $ARCH_FLAG \
            backend/run_server.py

      - name: Build backend binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --name "nowspace-server" `
            --paths "." `
            --collect-submodules backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            backend/run_server.py

      - name: Copy sidecar binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp dist/nowspace-server frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Copy sidecar binary (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries
          Copy-Item dist/nowspace-server.exe frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}.exe

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}*

  build-tauri:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rosetta (macOS x86_64 on ARM)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download sidecar artifact
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: frontend/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x frontend/src-tauri/binaries/nowspace-server-${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'Nowspace ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            | Platform | File |
            |---|---|
            | **macOS (Apple Silicon)** | `Nowspace_x.x.x_aarch64.dmg` |
            | **macOS (Intel)** | `Nowspace_x.x.x_x64.dmg` |
            | **Windows** | `Nowspace_x.x.x_x64-setup.exe` |
            | **Linux (AppImage)** | `Nowspace_x.x.x_amd64.AppImage` |
            | **Linux (deb)** | `nowspace_x.x.x_amd64.deb` |

            ### First launch
            1. Open the app — it will show the **Settings** tab on first run
            2. Set your **Obsidian vault path** (the app auto-detects PARA structure)
            3. Enter your **Claude API key** (get one at [console.anthropic.com](https://console.anthropic.com/))
            4. The app switches to the Plan tab and loads your week

            Your API key is stored locally in `~/.nowspace/.env` and never leaves your machine.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
