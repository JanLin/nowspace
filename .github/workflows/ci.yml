name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # config.yaml is loaded at import time — the exact failure mode that
      # took down the first real deployment of main (PR #51)
      - run: cp config.yaml.example config.yaml
      - run: python -c "from backend.main import app; print('backend imports OK')"
      - run: python -m pytest backend/tests -q

  security:
    name: Dependency + code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit bandit

      # requirements.txt pins floors (>=), not versions, so this audits what
      # a fresh install actually resolves to rather than a stale lockfile.
      # Clean today. When it does fire it will be because a new release
      # carried a CVE in, which is exactly when it should stop a merge.
      - name: Dependency CVEs
        run: pip-audit -r requirements.txt --progress-spinner off

      # This one IS a gate. Tests are excluded because pytest is 300+ bare
      # asserts, and low severity is dropped because it is mostly that plus
      # string literals that look like passwords ('daily', 'morning').
      # Medium and high are few enough to keep at zero.
      - name: Python SAST
        run: bandit -q -r backend/ -x backend/tests --severity-level medium

  baseline:
    name: Baseline (no extensions)
    runs-on: ubuntu-latest
    # The coupling this guards against creeps back quietly: a seam grows a
    # reach into an extension, and nobody notices until a subscriber's Docker
    # image won't start. Treat a failure here the way the canary harness in
    # test_handoff.py is treated — a build failure, not a report.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: cp config.yaml.example config.yaml
      # Nothing installed, nothing listed, nothing in the environment
      - name: Boot and test with an empty extension list
        env:
          NOWSPACE_ADDONS: ""
        run: |
          python - <<'PY'
          from backend.addons import ADDON_MODULES, addon_modules
          assert ADDON_MODULES == [], f"an extension is committed into the default build: {ADDON_MODULES}"
          assert addon_modules() == [], addon_modules()
          from backend.main import app, _mounted_addons
          assert _mounted_addons == [], _mounted_addons
          print("baseline boots with no extensions")
          PY
          python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend with an empty registry
        working-directory: frontend
        env:
          NOWSPACE_ADDONS_UI: ""
        run: |
          if grep -qE '^\s*(import|register)' src/addons.generated.ts; then
            echo "addons.generated.ts registers something in the baseline build"; exit 1
          fi
          npm ci
          npm run build
          # A baseline build regenerates the stub identically, so it must
          # leave the tree clean — otherwise every deployment that builds
          # would carry a spurious local change into the next update.
          git diff --exit-code src/addons.generated.ts

  frontend:
    name: Type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # -p tsconfig.app.json, not bare tsc: the root tsconfig is Vite's
      # project-reference stub ("files": []), so plain `tsc --noEmit` has no
      # inputs and passes on anything — this step was green for months while
      # checking nothing.
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vite build
      # Clean at zero today, so keep it a gate rather than advisory.
      - run: npm audit --audit-level=high
