name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # config.yaml is loaded at import time — the exact failure mode that
      # took down the first real deployment of main (PR #51)
      - run: cp config.yaml.example config.yaml
      - run: python -c "from backend.main import app; print('backend imports OK')"
      - run: python -m pytest backend/tests -q

  security:
    name: Dependency + code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit bandit

      # Advisory, not a gate. There are known CVEs in the starlette /
      # python-multipart chain whose fixes need a FastAPI major upgrade —
      # real work, but not a reason to block every unrelated PR until it
      # lands. Read the output; make it blocking once the upgrade is done.
      - name: Dependency CVEs (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off

      # This one IS a gate. Tests are excluded because pytest is 300+ bare
      # asserts, and low severity is dropped because it is mostly that plus
      # string literals that look like passwords ('daily', 'morning').
      # Medium and high are few enough to keep at zero.
      - name: Python SAST
        run: bandit -q -r backend/ -x backend/tests --severity-level medium

  frontend:
    name: Type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # -p tsconfig.app.json, not bare tsc: the root tsconfig is Vite's
      # project-reference stub ("files": []), so plain `tsc --noEmit` has no
      # inputs and passes on anything — this step was green for months while
      # checking nothing.
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vite build
      # Clean at zero today, so keep it a gate rather than advisory.
      - run: npm audit --audit-level=high
