[package]
name = "nowspace"
version = "0.4.12"
description = "Nowspace - Personal Coaching Agent"
authors = ["Jan Lindquist"]
edition = "2021"

[lib]
name = "nowspace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
