<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nowspace-compass-icon.svg" />
    <!-- interactive-widget: on Android the layout shrinks when the keyboard
         opens, so fixed bars rise above it and the caret can be scrolled
         into view (iOS ignores this and is handled in code instead) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nowspace" />
    <link rel="apple-touch-icon" href="/nowspace-compass-icon.svg" />
    <title>Nowspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
