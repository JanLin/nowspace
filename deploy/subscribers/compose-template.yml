# Per-subscriber Nowspace instance. Generated by new-subscriber.sh —
# __NAME__ is replaced with the subscriber's name.
#
# Access model: NO host ports are published. The app is reachable only
# through the tailscale sidecar, which joins the SUBSCRIBER's tailnet
# (they authenticate via a one-time login link — no keys change hands).
# Only their devices can reach the instance; the host cannot even via
# localhost.
name: nowspace-__NAME__

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: nowspace-__NAME__-ts
    hostname: __NAME__-nowspace
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  nowspace:
    image: ghcr.io/janlin/nowspace:latest
    container_name: nowspace-__NAME__-app
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./vault:/vault
      - ./memory:/app/memory
    environment:
      - VAULT_PATH=/vault
    restart: unless-stopped

  # Optional: Obsidian in the browser (web-streamed GUI), warm in the
  # background on the same vault. Enable with:  --profile obsidian
  # Reached at https://__NAME__-nowspace.<their-tailnet>.ts.net:8443
  obsidian:
    profiles: ["obsidian"]
    image: lscr.io/linuxserver/obsidian:latest
    container_name: nowspace-__NAME__-obsidian
    network_mode: service:tailscale
    volumes:
      - ./vault:/vault
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
    shm_size: "1gb"
    restart: unless-stopped
